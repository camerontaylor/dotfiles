# NOTE: this file is the shared BASE, not the deployed file. Deploy
# (scripts/deploy.d/20_symlinks.zsh) GENERATES ~/.config/gnupg/gpg-agent.conf
# from it, appending a host-resolved `pinentry-program` line pointing at the
# pinentry-auto wrapper (scripts/pinentry-auto). Edit here, then redeploy.
enable-ssh-support
allow-loopback-pinentry
