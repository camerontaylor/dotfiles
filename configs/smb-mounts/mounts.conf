# mounts.conf — which Macs auto-mount which ceres Samba shares.
#
# Consumed by scripts/smb-mount (run at login + every 5 min by the
# com.github.ctaylor.smb-mount LaunchAgent, installed by
# scripts/deploy.d/76_smb_mounts.zsh). A Mac not listed here mounts nothing;
# non-macOS hosts skip the fragment entirely.
#
# Row format — four whitespace-separated fields:
#
#   HOST   SHARE   MOUNTPOINT   ADDR[,ADDR...]
#
#   HOST        short hostname of the CLIENT (scutil --get LocalHostName)
#   SHARE       Samba share name on the server (see configs/samba/smb.conf)
#   MOUNTPOINT  relative to $HOME — created if absent, never outside $HOME
#               (/Volumes is root:wheel 0755, so mounting there would need
#               sudo and this stays a no-root home-layer agent)
#   ADDR list   server addresses tried IN ORDER, first to answer on 445 wins
#
# The address list is the same two-tier probe ssh/config uses, and for the
# same reason: smb.conf pins `interfaces = lo eno2 wlan0` + `bind interfaces
# only`, so smbd listens on the wired and wifi addresses and NOT on
# tailscale0. Bare `ceres` resolves to the Tailscale IP via MagicDNS on these
# Macs, which would connect to an address with nothing on 445 — hence
# literal addresses here, wired (static, line rate) before wifi (DHCP; pinned
# by router reservation, last captured 2026-06-07).

# host      share   mountpoint   addresses (wired, then wifi)
saturn      home    mnt/ceres    10.77.0.74,192.168.0.74
neptune     home    mnt/ceres    10.77.0.74,192.168.0.74
