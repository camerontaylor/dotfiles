# collectors.conf — which Macs run the CodexBar plan-quota collector.
#
# Consumed by scripts/deploy.d/78_codexbar_serve.zsh (which installs the
# com.github.ctaylor.codexbar-serve LaunchAgent running scripts/codexbar-serve).
# A Mac not listed here runs nothing; non-macOS hosts skip the fragment
# entirely — same host-gate shape as configs/smb-mounts/mounts.conf.
#
# Exactly ONE host should be listed at a time: ceres's cue engine and Caddy
# point at a single collector address, and the pacing-cue dedup state on
# ceres assumes one /usage authority. (A second collector can run harmlessly
# during a migration — both answer /usage independently — but only one is
# wired to the cues.)
#
# The z.ai API key and dashboard token do NOT ride with deploy (secrets);
# see ~/.local/agents/docs/llm-quota.md for the copy-over runbook.

# host
neptune
