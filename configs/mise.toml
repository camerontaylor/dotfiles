[tools]
# Language runtimes — pin to channels/major lines so a surprise major release
# doesn't land on shell startup. Bump explicitly with `mise upgrade <tool>`.
bun = "1"
python = "3"
uv = "0.11.16"
# node is mise-managed: the ONE node on every PATH — interactive shells and
# systemd units alike resolve it via ~/.local/share/mise/shims. Pin the major:
# an unattended major bump breaks native-module ABIs (node-pty in t3) and any
# service resolving node through mise. Bump explicitly, then re-run
# ./deploy.zsh so npm globals reinstall into the new prefix.
# npm globals live in ~/.local/dotfiles/.default-npm-packages, installed
# through mise node's npm by scripts/deploy.d/70_runtime_installs.zsh (and by
# mise itself on node install, via the ~/.default-npm-packages symlink).
# EXCEPTION: openclaw is deliberately excluded from that list (2026-08-27) — it
# was silently downgraded beta->stable four times by this very path. It is
# installed/repaired only by the ExecStartPre guard on openclaw-gateway.service
# (~/repos/hart/scripts/openclaw-ensure-beta.sh). On a node bump, also update
# NODE_PREFIX in that guard and ExecStart in the unit — both pin an absolute
# node path so the gateway does not silently keep running the old prefix.
node = "24"
# CLI tools migrated from deploy.zsh's per-tool installers / rust_tools array.
# Aqua backends (prebuilt binaries) are preferred where available, falling back
# to cargo. linear-cli has no mise backend → still installed via cargo in deploy.zsh.
# Pinned to current major; bump with `mise upgrade <tool>` when ready.
neovim = "0"
ripgrep = "14"
ast-grep = "0"
gh = "2"
glab = "1"
# delta >=0.19 and fd >=10.4 dropped x86_64-apple-darwin release binaries
# (aqua-registry supported_envs exclude darwin/amd64), which hard-fails
# `mise install` on Intel macs (e.g. neptune). Pin the last x64-mac versions
# there; everything else tracks latest.
"aqua:dandavison/delta" = "{% if os() == 'macos' and arch() == 'x64' %}0.18.2{% else %}0{% endif %}"
bat = "0"
eza = "0"
fd = "{% if os() == 'macos' and arch() == 'x64' %}10.3.0{% else %}10{% endif %}"
sd = "1"
yq = "4"
# portless is ALSO a mise npm: tool (besides the npm global): the GitHub
# runner units run `mise exec --cd ~/repos/webfront -- run.sh`, that repo's
# mise config requires npm:portless, and its portless-env.sh needs the CLI in
# that non-interactive env to export PUBLIC_URL/PORTLESS_NAME. Do NOT add this
# to the obsolete-uninstall list in 70_runtime_installs.zsh.
"npm:portless" = "latest"
zoxide = "0"
tree-sitter = "0"
# Migrated from tools/ submodules (saved ~166M of submodule history). fzf has a
# curated aqua backend; pnpm-shell-completion (Rust) has no mise registry entry
# but ships GitHub release binaries, so use the github backend. (b4b4r07/httpstat
# is a bash script with no release binaries — vendored under tools/vendor/ instead.)
"aqua:junegunn/fzf" = "0"
"github:g-plane/pnpm-shell-completion" = "0.5.5"
awscli = "2"
sops = "3"
# The registry's default age backend is aqua:FiloSottile/age, which does not
# publish Intel macOS binaries. The GitHub backend supports this host.
"github:FiloSottile/age" = "1.3.1"
# AI/dev tools intentionally tracking leading edge (move fast, want updates).
# opencode is installed as an npm global (opencode-ai) via .default-npm-packages,
# NOT through mise: the aqua:anomalyco/opencode backend lags upstream releases
# and warns on every shell startup when a new version isn't yet published there.
# CodeWhale is installed and upgraded from crates.io by
# scripts/deploy.d/70_runtime_installs.zsh.

[settings]
# Respect version files: .node-version, .tool-versions
idiomatic_version_file = true
trusted_config_paths = ["/home/ctaylor/repos/webfront"]

[settings.python]
compile = false
