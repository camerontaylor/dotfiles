[tools]
# Language runtimes — pin to channels/major lines so a surprise major release
# doesn't land on shell startup. Bump explicitly with `mise upgrade <tool>`.
bun = "1"
python = "3"
uv = "0.11.16"
# node is mise-managed: the ONE node on every PATH — interactive shells and
# systemd units alike resolve it via ~/.local/share/mise/shims. Pin the major:
# an unattended major bump breaks native-module ABIs (node-pty in t3) and any
# service resolving node through mise. Bump explicitly, then re-run
# ./deploy.zsh so npm globals reinstall into the new prefix.
# npm globals live in ~/.local/dotfiles/.default-npm-packages, installed
# through mise node's npm by scripts/deploy.d/70_runtime_installs.zsh (and by
# mise itself on node install, via the ~/.default-npm-packages symlink).
# EXCEPTION: openclaw is deliberately excluded from that list (2026-08-27) — it
# was silently downgraded beta->stable four times by this very path. It is
# installed/repaired only by the ExecStartPre guard on openclaw-gateway.service
# (~/repos/hart/scripts/openclaw-ensure-beta.sh). On a node bump, also update
# NODE_PREFIX in that guard and ExecStart in the unit — both pin an absolute
# node path so the gateway does not silently keep running the old prefix.
node = "24"
# CLI tools migrated from deploy.zsh's per-tool installers / rust_tools array.
# Aqua backends (prebuilt binaries) are preferred where available, falling back
# to cargo. linear-cli has no mise backend → still installed via cargo in deploy.zsh.
# Pinned to current major; bump with `mise upgrade <tool>` when ready.
neovim = "0"
ripgrep = "14"
ast-grep = "0"
gh = "2"
glab = "1"
# Needed so the global `cargo`/`rustc`/etc. mise shims actually resolve.
# scripts/deploy.d/70_runtime_installs.zsh installs rust via rustup (not
# mise) into ~/.cargo/bin, and mise's core rust backend recognizes an
# already-active rustup toolchain rather than downloading its own — on a
# box that already has one, this is a symlink, zero extra bytes (verified
# on neptune: ~/.local/share/mise/installs/rust/1.85.1 -> ~/.cargo/bin).
# Without this pin the shims exist (mise creates them the moment any
# project — e.g. paseo's own .tool-versions — resolves rust once) but have
# no active version outside that project's directory, so `have cargo`
# (a bare `command -v`) reports true while `cargo install` actually fails
# with "No version is set for shim" — silently breaking the
# linear-cli/CodeWhale cargo installs below whenever they run from outside
# a rust-pinning project directory.
rust = "1"
# delta >=0.19 and fd >=10.4 dropped x86_64-apple-darwin release binaries
# (aqua-registry supported_envs exclude darwin/amd64), which hard-fails
# `mise install` on Intel macs (e.g. neptune). Pin the last x64-mac versions
# there; everything else tracks latest.
"aqua:dandavison/delta" = "{% if os() == 'macos' and arch() == 'x64' %}0.18.2{% else %}0{% endif %}"
bat = "0"
eza = "0"
fd = "{% if os() == 'macos' and arch() == 'x64' %}10.3.0{% else %}10{% endif %}"
sd = "1"
yq = "4"
# portless is ALSO a mise npm: tool (besides the npm global) — retained as
# generic dev tooling (stable named *.localhost URLs for local development).
# Its original consumer was the webfront app's GitHub-runner units (`mise
# exec --cd ~/repos/webfront -- run.sh`; that repo's mise config required
# npm:portless in a non-interactive env). webfront was retired 2026-09-08
# (docs/fleet-consolidation.md); the dual install deliberately stays. Do NOT
# add this to the obsolete-uninstall list in 70_runtime_installs.zsh.
"npm:portless" = "latest"
zoxide = "0"
tree-sitter = "0"
# Migrated from tools/ submodules (saved ~166M of submodule history). fzf has a
# curated aqua backend; pnpm-shell-completion (Rust) has no mise registry entry
# but ships GitHub release binaries, so use the github backend. (b4b4r07/httpstat
# is a bash script with no release binaries — vendored under tools/vendor/ instead.)
"aqua:junegunn/fzf" = "0"
"github:g-plane/pnpm-shell-completion" = "0.5.5"
awscli = "2"
sops = "3"
# The registry's default age backend is aqua:FiloSottile/age, which does not
# publish Intel macOS binaries. The GitHub backend supports this host.
"github:FiloSottile/age" = "1.3.1"
# Resource monitoring — the glance / attribution / profiling set (docs/monitoring.md).
# btop is the glance layer on BOTH platforms but is gated to Linux *here*:
# aristocratos/btop publishes no darwin release assets at all (checked
# 2026-09-04 against v1.4.7 — Linux x86_64/aarch64/i686 only), so an ungated
# entry would hard-fail `mise install` on saturn and neptune, the same way
# delta/fd/age did above. The Macs take brew's btop bottle in 75_brew_setup.zsh.
# The `os = [...]` key filters the tool out of resolution entirely on other
# platforms — unlike the version-conditional trick used for delta/fd, which
# still requires *some* installable version to exist everywhere.
# Pinned exactly at 1.4.7 = upstream latest, same as brew serves the Macs, so
# both platforms emit the same btop.conf and stop churning the tracked copy
# (mechanism: 20_symlinks.zsh). The 1.4.6 hold was for aqua's .tbz-only asset
# template vs 1.4.7's brief .tar.gz-only release; verified resolving 2026-09-13.
btop = { version = "1.4.7", os = ["linux"] }
# bandwhich (per-process network) and samply (sampling profiler -> Firefox
# Profiler UI) have no mise registry entry, so both use the github backend;
# both publish darwin x86_64 + aarch64 and linux assets, so neither needs a
# per-host conditional. Pinned exactly, matching the other github: entries.
# samply MUST be pinned exactly rather than by major: its tags are prefixed
# (`samply-v0.13.1`) and the same repo also carries `perfrecord-v*` tags, so a
# loose spec can resolve to a different product's release.
"github:imsnif/bandwhich" = "0.23.1"
"github:mstange/samply" = "samply-v0.13.1"
# AI/dev tools intentionally tracking leading edge (move fast, want updates).
# opencode is installed as an npm global (opencode-ai) via .default-npm-packages,
# NOT through mise: the aqua:anomalyco/opencode backend lags upstream releases
# and warns on every shell startup when a new version isn't yet published there.
# Claude Code (was: claude.ai/install.sh curl in 70_runtime_installs.zsh) —
# the aqua backend ships the same native binaries the official installer
# does. The CLI's built-in auto-updater is disabled via [env] below so mise
# stays the only writer; 70_runtime_installs.zsh drift-corrects away the
# old native install (~/.local/bin/claude symlink + ~/.local/share/claude).
# NB: "0" is NOT mise's track-latest — it's a semver prefix that only
# tracks the leading edge for major-0 tools (neovim et al below). For
# claude-code/moor/wtp (major 2) an "0" row 404s at install time
# (`.../claude-code-releases/0/linux-x64/...`) and wtp even resolved a
# stale 0.4.0; majors are pinned per the CLAUDE.md rule instead. Caught
# 2026-09-08 when the fleet-m234 deploy reached makemake.
"aqua:anthropics/claude-code" = "2"
# CodeWhale: deliberately NOT mise-managed (removed 2026-09-09). The cargo:
# backends build from source and a single codewhale-tui rustc peaked at
# 11.9 GB RSS — kernel-OOM-killed on makemake (16 GB soldered, no swap, and
# now a service host). Hosts that still carry the pre-M4 rustup install in
# ~/.cargo/bin keep working; do NOT re-add cargo:codewhale-* rows without
# solving the build-memory problem (or a prebuilt backend) first.
# moor (was: scripts/install-moor.sh curl of the release binary). Upstream
# ships darwin x64/arm64 + linux assets, so no per-host conditional needed.
"ubi:walles/moor" = "2"
# wtp, Linux leg only (was: the release-asset curl in install-wtp.zsh).
# Upstream publishes no darwin-x86_64 asset, so an ungated entry would
# hard-fail `mise install` on the Intel Macs (neptune) the way delta/fd/age
# once did; macOS keeps install-wtp.zsh (brew tap, arm64 release asset as
# brew-failure fallback) — declared in ownership-declared.toml.
"ubi:satococoa/wtp" = { version = "2", os = ["linux"] }

# paseo CLI, Linux-only. The Macs get `paseo` from the app bundle (a symlink
# into /Applications/Paseo.app/Contents/Resources/bin/paseo, installed by the
# brew cask in 75_brew_setup.zsh), so an ungated entry would put a second,
# competing paseo ahead of it on PATH — mise shims precede ~/.local/bin.
#
# This entry exists ONLY so the bare `paseo` shim resolves on Linux boxes.
# mise shims resolve from config, never from what happens to be installed, so
# `mise install` alone (which is all the agents repo's scripts/setup-paseo.sh
# does — CROSS-REPO INVARIANT, mirrored by a note there) leaves
# `paseo ls` failing with "No version is set for shim" — as it did on ceres
# from the 0.7.0 beta install until 2026-09-06. The paseo *skills* assume a
# working bare `paseo`, and they were silently Mac-only without this.
#
# KEEP THIS PIN IN SYNC with the daemon's, which the agents repo's
# scripts/setup-paseo.sh writes into paseo-daemon.service's ExecStart
# (`mise exec npm:@getpaseo/cli@<ver>`).
# They are deliberately separate — the unit pins so a config change can never
# perturb a running daemon — but a CLI newer than the daemon it talks to is a
# skew bug, so bump both together. Do NOT loosen this to "beta": `mise upgrade`
# on every deploy would then walk the CLI ahead of the pinned daemon unattended.
"npm:@getpaseo/cli" = { version = "0.8.0-beta.1", os = ["linux"] }

[env]
# Claude Code's built-in auto-updater would rewrite its install out from
# under mise's pin (it recreates ~/.local/bin/claude pointing into
# ~/.local/share/claude). Disable it in every mise-activated context so
# `mise upgrade` is the only upgrade path; the drift-corrector in
# 70_runtime_installs.zsh removes whatever the updater left behind.
DISABLE_AUTOUPDATER = "1"

[settings]
# Respect version files: .node-version, .tool-versions
idiomatic_version_file = true
# Auto-trust mise configs in paseo agent worktrees (~/.paseo/worktrees/<agent>/<wt>/).
# Per-worktree `mise trust` can't keep up: every new worktree is a new path, so any
# agent shelling into one died with "config files are not trusted" (exit 1). Entries
# here are path PREFIXES, not globs — a bare directory covers configs at any depth
# under it, while "~/.paseo/worktrees/**" matches nothing (verified on 2026.5.15).
# Scope: this trusts whatever .mise.toml an agent clones or writes into any worktree,
# bypassing mise's confirm-before-running-arbitrary-config-code gate for those paths.
trusted_config_paths = ["~/.paseo/worktrees"]

[settings.python]
compile = false
