# /etc/keyd/default.conf
# Linux counterpart to the macOS Karabiner "Caps Lock = Hyper / Escape" rule.
# keyd is a system-level remapper (runs as root, before the compositor), so this
# works identically under Sway/Wayland, X11, and even the TTY.
#
# Installed to /etc/keyd/default.conf by scripts/deploy.d/79_keyd.zsh (Linux only;
# needs root + the `keyd` package). After changes: `sudo keyd reload`.
# Verify what keyd emits with: `sudo keyd monitor`.
#
# Caps Lock:
#   • tapped       -> Escape
#   • held         -> Hyper, i.e. Control+Alt+Shift+Super held for the next key
#
# Sway reads that combo as  $hyper = Mod4+Mod1+Control+Shift  (see configs/sway/config),
# so Caps+t / Caps+b / Caps+c … fire the same launch plane as Hyper on the Macs.

[ids]
*

[main]
# overload(layer, key): hold = activate <hyper> layer, tap = send <esc>.
capslock = overload(hyper, esc)

# A modifier-layer: while active it virtually holds Control+Alt+Shift+Meta(Super).
# keyd modifier letters: C=Control  A=Alt  S=Shift  M=Meta/Super  G=AltGr.
[hyper:C-A-S-M]
