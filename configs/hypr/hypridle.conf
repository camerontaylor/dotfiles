# hypridle — idle daemon (replaces swayidle). Pairs with hyprlock.
# Behavior mirrors the previous swayidle setup:
#   lock @ 5min, monitors off @ 10min, lock on suspend.

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid spawning multiple instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend (inhibitor-safe)
    after_sleep_cmd = niri msg action power-on-monitors
    ignore_dbus_inhibit = false
}

# Lock the session after 5 minutes idle.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn monitors off after 10 minutes idle; back on when activity resumes.
listener {
    timeout = 600
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}
