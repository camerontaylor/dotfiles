# hypridle — idle daemon (replaces swayidle). Pairs with hyprlock.
# Behavior mirrors the previous swayidle setup:
#   lock @ 30min, monitors off @ 35min on AC / 10min on battery, lock on suspend.

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid spawning multiple instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend (inhibitor-safe)
    after_sleep_cmd = niri msg action power-on-monitors
    ignore_dbus_inhibit = false
}

# Lock the session after 30 minutes idle.
listener {
    timeout = 1800
    on-timeout = loginctl lock-session
}

# Monitors off after 35 min idle on AC, 10 min on battery; back on when activity
# resumes. hypridle has no power-state conditionals, so each listener guards on
# ADP1/online (1 = on AC) inside on-timeout — the other listener no-ops. A box
# with no ADP1 (desktop) counts as AC, so its monitors still blank.

# On AC power: monitors off after 35 minutes idle.
listener {
    timeout = 2100
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/ADP1/online 2>/dev/null || echo 1)" = 1 ] && niri msg action power-off-monitors'
    on-resume = niri msg action power-on-monitors
}

# On battery: monitors off after 10 minutes idle.
listener {
    timeout = 600
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/ADP1/online 2>/dev/null)" = 0 ] && niri msg action power-off-monitors'
    on-resume = niri msg action power-on-monitors
}
