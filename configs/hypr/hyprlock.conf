# hyprlock — screen locker (replaces swaylock). Fingerprint via fprintd.
# Native fingerprint backend scans immediately on lock; password is fallback.

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint or type password
        present_message = Scanning fingerprint...
        retry_delay = 250
    }
}

background {
    monitor =
    color = rgba(18, 18, 28, 1.0)
    blur_passes = 0
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 48
    font_family = sans-serif
    color = rgba(220, 220, 230, 1.0)
    position = 0, 90
    halign = center
    valign = center
}

# Username hint
label {
    monitor =
    text = $USER
    font_size = 16
    color = rgba(180, 180, 200, 0.9)
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(80, 80, 110, 1.0)
    inner_color = rgba(30, 30, 45, 1.0)
    font_color = rgba(220, 220, 230, 1.0)
    placeholder_text = <i>Password or fingerprint</i>
    fail_text = <i>Auth failed ($ATTEMPTS)</i>
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}
