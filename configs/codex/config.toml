# oh-my-codex top-level settings (must be before any [table])
notify = ["node", "/home/ctaylor/.local/share/mise/installs/npm-oh-my-codex/0.15.1/lib/node_modules/oh-my-codex/dist/scripts/notify-hook.js"]
model_reasoning_effort = "medium"
developer_instructions = "You have oh-my-codex installed. AGENTS.md is the orchestration brain and main control surface. Follow AGENTS.md for skill/keyword routing, $name workflow invocation, and role-specialized subagents. Native subagents live in .codex/agents and may handle independent parallel subtasks within one Codex session or team pane. Skills load from .codex/skills, not native-agent TOMLs. Treat installed prompts as narrower execution surfaces under AGENTS.md authority."

suppress_unstable_features_warning = true
model = "gpt-5.5"
model_context_window = 1000000
model_auto_compact_token_limit = 100000
sandbox_mode = "danger-full-access"
approval_policy = "never"

[projects."/home/ctaylor/repos/webfront"]
trust_level = "trusted"

[projects."/home/ctaylor/repos/oh-my-claudecode"]
trust_level = "trusted"

[projects."/home/ctaylor"]
trust_level = "trusted"

[projects."/home/ctaylor/.local/dotfiles"]
trust_level = "trusted"

[projects."/home/ctaylor/repos/worktrees/fix/tests"]
trust_level = "trusted"

[projects."/home/ctaylor/Downloads"]
trust_level = "trusted"

[projects."/home/ctaylor/repos/telemetry"]
trust_level = "trusted"

[features]

js_repl = true
image_detail_original = true
codex_hooks = true
multi_agent = true
child_agents_md = true
[agents]
max_threads = 12
max_depth = 4

[mcp_servers.web-to-mcp]
url = "https://web-to-mcp.com/mcp/541f0cbf-c5e3-4e77-9170-885d742bb4bf/"

[mcp_servers.react-grab-mcp]
command = "/home/ctaylor/repos/webfront/packages/app/node_modules/.bin/react-grab-mcp"
args = [ "--stdio" ]
enabled = false
startup_timeout_sec = 5

[history]
# Keep Codex history indefinitely; Codex only supports save-all/none, not age-based retention.
persistence = "save-all"

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.4"

[tui.model_availability_nux]
"gpt-5.5" = 2

