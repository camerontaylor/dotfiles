# Hosts that get the OBS two-track recording setup (opt-in).
#
# One short hostname per line (matches `scutil --get LocalHostName`, falling
# back to `hostname -s`). Lines starting with # are ignored. A host NOT listed
# here is skipped entirely by scripts/deploy.d/77_obs.zsh -- OBS is neither
# installed nor configured on it. This is deliberately opt-in: leave a machine
# off this list and deploy never touches OBS on it.
#
# To enable OBS on a machine, add its short hostname below and re-run deploy.
neptune
