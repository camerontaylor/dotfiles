# Samba config for ceres — the office-LAN file server.
# Installed to /etc/samba/smb.conf by scripts/setup-ceres-share.sh.
#
# Serves [downloads] to the planet boxes, wired segment preferred (see the
# office-LAN note in CLAUDE.md). Mac clients are first-class: vfs_fruit stores
# Finder metadata/resource forks as xattr streams so .DS_Store/._AppleDouble
# litter stays out of the share.

[global]
    server string = ceres
    server role = standalone server

    # Office wired segment + wifi fallback only — never the overlay ifaces.
    interfaces = lo eno2 wlan0
    bind interfaces only = yes

    # Modern SMB only: no NetBIOS, no SMB1. macOS and Linux cifs both speak
    # SMB2/3; discovery is by IP / ssh-config hostnames, not browsing.
    disable netbios = yes
    smb ports = 445
    server min protocol = SMB2_10

    # Mac interop (Apple SMB extensions).
    vfs objects = fruit streams_xattr
    fruit:metadata = stream
    fruit:model = MacSamba
    fruit:posix_rename = yes
    fruit:veto_appledouble = no
    fruit:delete_empty_adfiles = yes
    fruit:wipe_intentionally_left_blank_rfork = yes

    map to guest = Never
    logging = systemd
    log level = 1

[downloads]
    path = /srv/downloads
    valid users = ctaylor
    read only = no
    browseable = yes
    # Group-writable with setgid dirs so everything stays ctaylor-owned and
    # rsync/ssh writes into the same tree don't fight the SMB-created files.
    create mask = 0664
    directory mask = 2775

# ── [home] — ctaylor's home dir, for the Mac workstations (saturn, neptune).
#
# Mounted read-write. `veto files` is doing two different jobs here, and the
# entries are grouped accordingly:
#
#   1. SECRETS. A veto is a real denial, not just a hide — smbd will not open
#      these even by exact path. Home is the one share where a credential tree
#      sits next to the files you actually want, so .ssh/.gnupg/.aws/.config
#      stay unreachable over SMB. Use ssh for those.
#   2. BULK + LITTER. immich (49G, served by immich itself), the CI runner and
#      bench trees, and per-language caches are pure Finder-enumeration cost
#      over a network share. node_modules is vetoed at every level (a veto
#      pattern matches at each directory, not just the share root), which is
#      what keeps `repos` browsable. .DS_Store keeps Finder litter out of the
#      git repos underneath.
#
# Vetoes cost a name check per directory entry; drop lines from the second
# group if you need something back. Note also that Samba's default
# `wide links = no` blocks symlinks pointing outside /home/ctaylor — the
# dotfiles XDG symlinks all resolve inside it, so they work, but a link to
# /srv or /mnt will not.
#
# NOT the magic [homes] section (which auto-shares each user's own home under
# their username); this is an ordinary share with an explicit path.
[home]
    path = /home/ctaylor
    valid users = ctaylor
    read only = no
    browseable = yes
    # Plain home-dir semantics — no setgid, unlike [downloads] which is a
    # shared drop tree.
    create mask = 0644
    directory mask = 0755
    # ONE line, deliberately: Samba silently ignores a second `veto files`
    # (and `+=` on it) — testparm shows only the first ever taking effect.
    veto files = /.ssh/.gnupg/.aws/.config/.claude.json*/.codex/.agents/immich/actions-runner/ci-bench/.cache/.npm/.cargo/.bun/node_modules/.DS_Store/
