# Snapshot of /etc/tmpfiles.d/appreciation.conf (root-owned, hand-installed
# 2026-09-05) — preserved here 2026-09-08 because it was tracked in no repo.
# The appreciation repo (~/repos/hart/appreciation, gitignored by hart) tracks
# its units under scripts/systemd/ but not this file; treat that repo as the
# app's home and move this there if its layout ever grows a /etc pair.
#
# Install by hand (fleet convention for /etc is copies, not symlinks):
#   sudo install -m 644 -o root -g root \
#     ~/.local/dotfiles/configs/appreciation/appreciation.conf \
#     /etc/tmpfiles.d/appreciation.conf
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/appreciation.conf
#
# Context: docs/caddy-ingress.md (appreciation.wedrifid.dev row) and the
# appreciation repo's docs/adr/0005-placement-and-privacy-boundary.md.

# Appreciation's socket directory. Owned by Cameron (the app writes the socket) with group
# caddy (the TLS terminator connects to it). 0750 means the group can traverse and nobody else
# can — the directory, not the socket mode, is what actually gates who may reach the app.
#
# The setgid bit (2750) is why this works without adding ctaylor to the caddy group: the socket
# inherits group caddy from the directory at creation, so the app never needs a chgrp it has no
# privilege to perform. Dropping the 2 breaks the deployment and the app will refuse to start.
d /run/appreciation 2750 ctaylor caddy -
