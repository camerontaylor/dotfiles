# fuzzel — fallback launcher (Mod+Shift+D) and clipboard-history picker.
# Primary launcher is Vicinae (Mod+D); fuzzel is the lightweight backstop.

[main]
font=Noto Sans:size=12
prompt="❯ "
terminal=ghostty -e
layer=overlay
width=44
lines=12
horizontal-pad=20
vertical-pad=16
inner-pad=8
line-height=22
icon-theme=Papirus-Dark
fields=name,generic,comment,categories,filename,keywords

[colors]
background=1e1e2eee
text=cdd6f4ff
match=f9e2afff
selection=313244ff
selection-text=cdd6f4ff
selection-match=f9e2afff
border=89b4faff

[border]
width=2
radius=10

[dmenu]
exit-immediately-if-empty=yes
