# ownership-declared.toml — the declared-exception registry consumed by
# scripts/tests/ownership-gate.py (fleet-consolidation M2).
#
# Every entry here is a deliberate, owner-reviewed exception to the
# "one declared owner per artifact" invariant — not a TODO list. The gate
# fails on multi-mechanism tools / shipped-or-written service artifacts that
# lack an entry here, AND on entries that have gone stale (artifact now
# single-mechanism, or gone entirely). When M3/M4 removes a duplication,
# delete its entry in the same commit.
#
# [dual_install.TOOL]
#   mechanisms = [...]      # mechanisms the gate will observe; subset match
#   reason     = "..."      # required — the audit trail for the exception
#
# [service_artifact.NAME]   # NAME = repo path (tracked) or unit/plist basename
#   manifest_ids = [...]    # infra manifest artifact ids attesting it
#                           # (verified in full mode; absent on CI by design)
#   reason       = "..."    # required when manifest_ids is empty
#   writers      = [...]    # files that write/generate it — required when the
#                           # artifact has more than one possible writer, to
#                           # pin the known set (a NEW writer site fails)

# ── dual installs: mise primary + brew fallback (50_mise.zsh fallback loop) ──
# The loop runs only on macOS and only when a tool is still missing post-mise
# (aqua release-URL drift). It is a hedge that has actually fired on the
# fleet, not a dead branch — declared, not removed.

[dual_install.awscli]
mechanisms = ["mise", "brew"]
reason = "brew is the macOS-only post-mise fallback (50_mise.zsh loop) when aqua drifts; never concurrent on Linux"

[dual_install.bat]
mechanisms = ["mise", "brew"]
reason = "brew is the macOS-only post-mise fallback (50_mise.zsh loop) when aqua drifts; never concurrent on Linux"

