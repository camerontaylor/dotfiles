[dual_install."ast-grep"]
mechanisms = ["mise", "brew", "npm-global"]
reason = "npm-global (@ast-grep/cli) is the interactive CLI; the mise entry additionally provides the library/napi artifact to non-node environments; brew is the macOS fallback loop. Same upstream, deliberately split surfaces"

# ── dual installs: per-OS splits (never concurrent on one host) ────────────

[dual_install.age]
mechanisms = ["mise", "brew"]
reason = "upstream releases dropped x86_64-apple-darwin, so Intel Macs can't get age via mise; brew bottles ship both arches (75_brew_setup.zsh darwin block). Concurrent on Intel macOS by design, absent on Linux"

[dual_install.btop]
mechanisms = ["mise", "brew"]
reason = "per-OS split: mise entry is os=[linux]; brew installs on macOS. Never concurrent"

[dual_install.delta]
mechanisms = ["mise", "brew"]
reason = "upstream releases dropped x86_64-apple-darwin, so Intel Macs can't get git-delta via mise; brew bottles ship both arches (75_brew_setup.zsh darwin block). Concurrent on Intel macOS by design, absent on Linux"

[dual_install.fd]
mechanisms = ["mise", "brew"]
reason = "upstream releases dropped x86_64-apple-darwin, so Intel Macs can't get fd via mise; brew bottles ship both arches (75_brew_setup.zsh darwin block). Concurrent on Intel macOS by design, absent on Linux"

[dual_install."git-extras"]
mechanisms = ["apt", "aur"]
reason = "per-distro recipes (40_tools.zsh): apt on Debian/Ubuntu, aur helper on Arch. Never concurrent"

[dual_install.htop]
mechanisms = ["brew", "pacman"]
reason = "per-OS split (75_brew_setup.zsh): brew on macOS, pacman on Arch. Never concurrent"

[dual_install.mise]
mechanisms = ["brew", "curl"]
reason = "bootstrap order, not duplication: brew first on macOS, GitHub release-asset curl as fallback (and Linux primary). One survives; both paths kept so a fresh machine can always bootstrap"

[dual_install.mosh]
mechanisms = ["apt", "brew", "pacman"]
reason = "per-OS split (75_brew_setup.zsh): brew on macOS, pacman on Arch, apt on Debian. Never concurrent"

[dual_install.paseo]
mechanisms = ["brew-cask", "mise"]
reason = "per-OS split: brew cask delivers stable on macOS; the mise npm entry (os=[linux]) exists only so the bare `paseo` shim resolves on Linux boxes (see configs/mise.toml notes). Never concurrent"

[dual_install.portless]
mechanisms = ["mise", "npm-global"]
reason = "npm-global owns the dev-shell binary; the mise npm: entry lets `mise exec` environments resolve it without a system node (configs/mise.toml). Same npm package installed through two managers into the same prefix — do-not-uninstall note lives in mise.toml"

[dual_install.rust]
mechanisms = ["mise", "curl"]
reason = "one system, two touchpoints: rustup (curl bootstrap, 70_runtime_installs.zsh) is the designated toolchain owner; mise's rust = \"1\" is a symlink through rustup so shims resolve"

[dual_install.tailscale]
mechanisms = ["brew-cask", "curl", "pacman"]
reason = "per-OS split (73_tailscale.zsh): cask on macOS, pacman on Arch, tailscale.com/install.sh only on other Linux. Never concurrent"

[dual_install."testssl.sh"]
mechanisms = ["apt", "pacman"]
reason = "per-distro recipes (40_tools.zsh): apt on Debian/Ubuntu, pacman on Arch. Never concurrent"

[dual_install.wtp]
mechanisms = ["mise", "brew", "curl"]
reason = "per-OS/arch split: Linux is mise (ubi:satococoa/wtp, os=[linux] in configs/mise.toml); macOS keeps install-wtp.zsh — brew tap covers Intel Macs (upstream ships no darwin-x64 release asset), the release-asset curl is the Apple-Silicon brew-failure fallback. Never concurrent on one host"

